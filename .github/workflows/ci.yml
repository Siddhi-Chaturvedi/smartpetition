name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — lint, train, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests --output-format=github || true  # advisory gate

      - name: Generate dataset & train AI model
        run: |
          python -m app.ai.data.generate_dataset
          python -m app.ai.train_model

      - name: Evaluate AI model
        run: python -m app.ai.evaluate_model

      - name: Run backend tests (isolated SQLite)
        env:
          JWT_SECRET: ci-test-secret-value-not-for-production
        run: python -m pytest -q

  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + production build
        run: npm run build

      - name: Unit / component tests (Vitest + RTL)
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t smartpetition-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t smartpetition-frontend:ci ./frontend

  integration:
    name: Full-stack smoke test (compose)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Boot compose stack
        run: docker compose up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          docker compose logs; exit 1
      - name: Verify frontend serves and proxies API
        run: |
          curl -fsS http://localhost:8080/ | grep -q SmartPetition
          curl -fsS http://localhost:8080/api/v1/health | grep -q '"status"'
      - name: Teardown
        if: always()
        run: docker compose down -v
