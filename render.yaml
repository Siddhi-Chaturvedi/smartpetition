# Render Blueprint — one-click deploy for SmartPetition.
databases:
  - name: smartpetition-db
    plan: free
    databaseName: smartpetition
    user: smartpetition

services:
  - type: web
    name: smartpetition
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install -r backend/requirements.txt
      npm ci --prefix frontend --no-audit --no-fund
      npm run build --prefix frontend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: smartpetition-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FIRST_ADMIN_EMAIL
        value: admin@smartpetition.local
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
